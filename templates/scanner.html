<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tidez scanner</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #1b1d23;
        color: #e8e8ea;
    }
    header {
        padding: 14px 24px;
        background: #22242c;
        border-bottom: 1px solid #33353e;
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
    }
    header h1 { font-size: 1.1em; margin: 0; font-weight: 600; }
    .filter-box { display: flex; align-items: center; gap: 8px; }
    .filter-box input {
        background: #14151a; color: #e8e8ea; border: 1px solid #3a3d47;
        border-radius: 6px; padding: 6px 10px; font-size: 0.9em; width: 260px;
    }
    button {
        background: #3a3d47; color: #e8e8ea; border: none; border-radius: 6px;
        padding: 7px 14px; font-size: 0.9em; cursor: pointer;
    }
    button:hover { background: #4a4d59; }
    button.fav { background: #4a3d1f; }
    button.fav.active { background: #b58900; color: #1b1d23; font-weight: 600; }
    #status { color: #9a9ca6; font-size: 0.85em; }

    #idBar {
        padding: 8px 24px; background: #20222a; border-bottom: 1px solid #33353e;
        display: flex; gap: 24px; flex-wrap: wrap; font-size: 0.85em; align-items: center;
    }
    .id-item { display: flex; align-items: center; gap: 6px; }
    .id-item .id-label { color: #9a9ca6; }
    .id-item .id-value { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .id-item .id-value.empty { color: #5a5d68; }
    .id-item button { padding: 3px 9px; font-size: 0.85em; }
    .id-item button.copied { background: #2f6b3f; }

    main { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }
    #plotRow { display: flex; gap: 16px; align-items: flex-start; }
    #lightcurve { flex: 1; min-width: 0; height: 480px; }

    #legacyPanel {
        background: #22242c; border: 1px solid #33353e; border-radius: 8px;
        padding: 10px; text-align: center; width: 220px; flex-shrink: 0;
    }
    #legacyPanel .label {
        font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.5px;
        color: #9a9ca6; margin-bottom: 6px;
    }
    #legacyPanel img { width: 100%; border-radius: 4px; background: #000; }
    #legacyPanel .meta { font-size: 0.75em; color: #6a6d78; margin-top: 6px; }
    #legacyPanel .missing { color: #6a6d78; font-size: 0.85em; padding: 40px 0; }

    #cutouts {
        display: flex; gap: 16px; margin-top: 16px; justify-content: center;
    }
    .cutout-panel {
        background: #22242c; border: 1px solid #33353e; border-radius: 8px;
        padding: 10px; text-align: center; width: 220px;
    }
    .cutout-panel .label {
        font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.5px;
        color: #9a9ca6; margin-bottom: 6px;
    }
    .cutout-panel img { width: 100%; border-radius: 4px; background: #000; }
    #cutout-hint { text-align: center; color: #9a9ca6; margin-top: 16px; font-size: 0.9em; }
</style>
</head>
<body>

<header>
    <h1>tidez scanner</h1>
    <div class="filter-box">
        <input id="objidsFile" type="text" placeholder="objids file (e.g. boom_crossmatches.txt) - blank = all">
        <button id="applyFilter">Apply</button>
    </div>
    <button id="prevBtn">&lt; Prev</button>
    <button id="nextBtn">Next &gt;</button>
    <button id="favBtn" class="fav">☆ Favorite</button>
    <span id="status"></span>
</header>

<div id="idBar">
    <div class="id-item">
        <span class="id-label">DECam:</span>
        <span class="id-value" id="decamId">—</span>
        <button class="copyBtn" data-target="decamId">Copy</button>
    </div>
    <div class="id-item">
        <span class="id-label">ZTF:</span>
        <span class="id-value" id="ztfId">—</span>
        <button class="copyBtn" data-target="ztfId">Copy</button>
    </div>
    <div class="id-item">
        <span class="id-label">Rubin:</span>
        <span class="id-value" id="rubinId">—</span>
        <button class="copyBtn" data-target="rubinId">Copy</button>
    </div>
    <div class="id-item">
        <span class="id-label">RA, Dec:</span>
        <span class="id-value" id="radecId">—</span>
        <button class="copyBtn" data-target="radecId">Copy</button>
    </div>
</div>

<main>
    <div id="plotRow">
        <div id="lightcurve"></div>
        <div id="legacyPanel">
            <div class="label">Legacy Survey</div>
            <div id="legacy-content" class="missing">Loading…</div>
        </div>
    </div>
    <div id="cutout-hint">Click a DECam point on the lightcurve to load its cutouts.</div>
    <div id="cutouts" style="display:none;">
        <div class="cutout-panel"><div class="label">Template</div><img id="cutout-template"></div>
        <div class="cutout-panel"><div class="label">Science</div><img id="cutout-science"></div>
        <div class="cutout-panel"><div class="label">Diff</div><img id="cutout-diff"></div>
    </div>
</main>

<script>
// Bright, dark-background-safe variants of the intuitive u/g/r/i/z/y
// mapping (the matplotlib version's palette used pure black for 'z', which
// disappears against this UI's dark background).
const BAND_COLORS = { u: "#b06bff", g: "#3ddc71", r: "#ff5a5f", i: "#ff9f40", z: "#e8e8ea", y: "#c88b6a" };
const SURVEY_SYMBOL = { DECam: "diamond", ZTF: "circle", LSST: "triangle-up" };

let objids = [];
let index = 0;
let favorites = new Set();
let currentObjid = null;

// Bumped on every drawCurrent() call; a fetch response is only applied if
// this still matches the token it was issued under, so out-of-order
// responses from rapid Prev/Next clicks can't clobber a newer render.
let renderToken = 0;

const statusEl = document.getElementById("status");
const favBtn = document.getElementById("favBtn");
const lcDiv = document.getElementById("lightcurve");
const cutoutsDiv = document.getElementById("cutouts");
const cutoutHint = document.getElementById("cutout-hint");

function setIdField(id, value) {
    const el = document.getElementById(id);
    el.textContent = value || "—";
    el.classList.toggle("empty", !value);
}

function updateIdBar(data) {
    setIdField("decamId", data.objid);
    setIdField("ztfId", data.ztf_id);
    setIdField("rubinId", data.lsst_id);
    setIdField("radecId", `${data.ra}, ${data.dec}`);
}

document.getElementById("idBar").addEventListener("click", async (evt) => {
    const btn = evt.target.closest(".copyBtn");
    if (!btn) return;
    const value = document.getElementById(btn.dataset.target).textContent;
    if (!value || value === "—") return;
    await navigator.clipboard.writeText(value);
    btn.classList.add("copied");
    const original = btn.textContent;
    btn.textContent = "Copied!";
    setTimeout(() => { btn.classList.remove("copied"); btn.textContent = original; }, 1000);
});

function niceStep(range, targetTicks = 6) {
    const rough = range / targetTicks || 1;
    const mag = Math.pow(10, Math.floor(Math.log10(rough)));
    const norm = rough / mag;
    const step = norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10;
    return step * mag;
}

// Decimal places to show for a given tick step, so zooming into an hour-
// scale window doesn't collapse every tick to the same rounded integer day.
function decimalsForStep(step) {
    if (step >= 1) return 0;
    if (step >= 0.1) return 1;
    if (step >= 0.01) return 2;
    return 3;
}

// Recompute tick positions/labels for whatever x-range is currently
// visible (full extent on first draw, or the zoomed-in sub-range after a
// plotly_relayout). totalSpan converts "days since first detection" (the
// underlying x data) to "days ago" for the bottom axis's labels.
function computeTicks(rangeMin, rangeMax, totalSpan) {
    const step = niceStep(rangeMax - rangeMin);
    const decimals = decimalsForStep(step);
    const start = Math.ceil(rangeMin / step) * step;
    const tickvals = [];
    for (let v = start; v <= rangeMax + step / 2; v += step) tickvals.push(v);
    const ticktextDaysAgo = tickvals.map(v => (totalSpan - v).toFixed(decimals));
    const ticktextSinceFirst = tickvals.map(v => v.toFixed(decimals));
    return { tickvals, ticktextDaysAgo, ticktextSinceFirst };
}

// State for the current plot's full range / span, read by the
// plotly_relayout handler below to rebuild ticks on zoom/pan/reset.
let plotTotalSpan = 0;
let plotFullRange = [0, 1];

let relayoutListenerAttached = false;
function attachRelayoutListener() {
    if (relayoutListenerAttached) return;
    relayoutListenerAttached = true;
    lcDiv.on("plotly_relayout", (evt) => {
        let rMin, rMax;
        if (evt["xaxis.range[0]"] !== undefined && evt["xaxis.range[1]"] !== undefined) {
            rMin = evt["xaxis.range[0]"];
            rMax = evt["xaxis.range[1]"];
        } else if (evt["xaxis.autorange"] || evt["xaxis.range"] !== undefined) {
            // Double-click reset (or programmatic full-range reset).
            [rMin, rMax] = plotFullRange;
        } else {
            return;  // some other relayout (e.g. our own tick update below); ignore
        }
        const { tickvals, ticktextDaysAgo, ticktextSinceFirst } = computeTicks(rMin, rMax, plotTotalSpan);
        Plotly.relayout(lcDiv, {
            "xaxis.tickvals": tickvals, "xaxis.ticktext": ticktextDaysAgo,
            "xaxis2.tickvals": tickvals, "xaxis2.ticktext": ticktextSinceFirst,
        });
    });
}

async function loadFavorites() {
    const res = await fetch("/api/favorites");
    const data = await res.json();
    favorites = new Set(data.favorites);
}

async function loadObjects(objidsFile) {
    const url = objidsFile ? `/api/objects?objids_file=${encodeURIComponent(objidsFile)}` : "/api/objects";
    const res = await fetch(url);
    if (!res.ok) {
        statusEl.textContent = `Error: ${(await res.json()).detail}`;
        return;
    }
    const data = await res.json();
    objids = data.objids;
    index = 0;
    if (objids.length === 0) {
        statusEl.textContent = "No objects found.";
        Plotly.purge(lcDiv);
        return;
    }
    await drawCurrent();
}

function updateFavButton(objid) {
    const isFav = favorites.has(objid);
    favBtn.textContent = isFav ? "★ Favorited" : "☆ Favorite";
    favBtn.classList.toggle("active", isFav);
}

function resetCutouts() {
    cutoutsDiv.style.display = "none";
    cutoutHint.style.display = "block";
}

const legacyContent = document.getElementById("legacy-content");

async function loadLegacyCutout(objid) {
    legacyContent.className = "missing";
    legacyContent.textContent = "Loading…";
    const res = await fetch(`/api/objects/${encodeURIComponent(objid)}/legacy-cutout`);
    if (currentObjid !== objid) return;  // object changed while this was in flight
    if (!res.ok) {
        legacyContent.className = "missing";
        legacyContent.textContent = "No Legacy Survey cutout stored for this object.";
        return;
    }
    const data = await res.json();
    legacyContent.className = "";
    legacyContent.innerHTML = "";
    const img = document.createElement("img");
    img.src = `data:image/png;base64,${data.image}`;
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `${data.layer}, ${data.pixscale}"/px`;
    legacyContent.appendChild(img);
    legacyContent.appendChild(meta);
}

function buildTraces(rows) {
    const detectedJds = rows.filter(r => r.detected).map(r => r.jd);
    const jdFirst = detectedJds.length ? Math.min(...detectedJds) : Math.min(...rows.map(r => r.jd));

    const byLabel = {};
    for (const r of rows) {
        const label = r.detected ? `${r.band} (${r.survey})` : `${r.band} upper limit (${r.survey})`;
        if (!byLabel[label]) byLabel[label] = { rows: [], detected: r.detected, band: r.band, survey: r.survey };
        byLabel[label].rows.push(r);
    }

    const traces = [];
    for (const [label, group] of Object.entries(byLabel)) {
        const color = BAND_COLORS[group.band] || "#888888";
        const symbol = SURVEY_SYMBOL[group.survey] || "x";
        const isDecam = group.survey === "DECam";
        const xs = group.rows.map(r => r.jd - jdFirst);
        const ys = group.rows.map(r => group.detected ? r.mag : r.limmag);
        const customdata = group.rows.map(r => r.epoch_idx);
        // SNR/STATUS_FPHOT ('p'/'q'/'m') come from DECam forced photometry on
        // the difference image; surface them in the hover so it's easy to
        // eyeball which points are reliable ('p' > 'q' > 'm').
        const text = group.rows.map(r => isDecam
            ? `SNR: ${r.snr != null ? r.snr.toFixed(1) : "n/a"}  |  status: ${r.status}`
            : "");

        if (group.detected) {
            traces.push({
                x: xs, y: ys, customdata, text,
                error_y: { type: "data", array: group.rows.map(r => r.magerr), visible: true, color },
                mode: "markers", type: "scatter", name: label,
                marker: { color, symbol, size: 9, line: { width: 1, color: "#14151a" } },
                hovertemplate: `${label}<br>mag: %{y:.3f}<br>%{text}<extra></extra>`,
            });
        } else {
            traces.push({
                x: xs, y: ys, customdata, text,
                mode: "markers", type: "scatter", name: label,
                marker: { color, symbol: "triangle-down", size: 8, opacity: 0.4 },
                hovertemplate: `${label}<br>lim. mag (5σ): %{y:.3f}<br>%{text}<extra></extra>`,
            });
        }
    }
    return traces;
}

async function drawCurrent() {
    const token = ++renderToken;

    resetCutouts();
    const objid = objids[index];
    updateFavButton(objid);
    statusEl.textContent = `[${index + 1}/${objids.length}] ${objid}`;

    const res = await fetch(`/api/objects/${encodeURIComponent(objid)}/lightcurve`);
    const data = await res.json();

    if (token !== renderToken) return;  // a newer Prev/Next click already superseded this one
    currentObjid = objid;
    updateIdBar(data);
    loadLegacyCutout(objid);

    if (!data.rows.length) {
        Plotly.react(lcDiv, [], {
            title: `${objid}${data.title_suffix} (no lightcurve data)`,
            paper_bgcolor: "#1b1d23", plot_bgcolor: "#1b1d23", font: { color: "#e8e8ea" },
        });
        attachClickListener();
        return;
    }

    const traces = buildTraces(data.rows);

    const xs = traces.flatMap(t => t.x);
    const xMin = Math.min(0, ...xs);
    const xMax = Math.max(...xs);
    const totalSpan = data.jd_now - data.jd_first;
    const pad = (xMax - xMin) * 0.04 || 1;
    const range = [xMin - pad, xMax + pad];

    plotTotalSpan = totalSpan;
    plotFullRange = range;
    const { tickvals, ticktextDaysAgo, ticktextSinceFirst } = computeTicks(range[0], range[1], totalSpan);

    // xaxis2 mirrors xaxis' range (via `matches`) to draw a second, top-side
    // tick row over the same physical positions with different labels.
    traces.push({
        x: [xMin, xMax], y: [null, null], xaxis: "x2", yaxis: "y",
        mode: "markers", marker: { opacity: 0 }, showlegend: false, hoverinfo: "skip",
    });

    const layout = {
        title: { text: `${objid}${data.title_suffix}`, y: 0.99, yanchor: "top" },
        xaxis: {
            title: "Days ago", range, tickvals, ticktext: ticktextDaysAgo,
            color: "#e8e8ea", gridcolor: "#33353e",
        },
        xaxis2: {
            overlaying: "x", matches: "x", side: "top",
            tickvals, ticktext: ticktextSinceFirst,
            title: { text: "Days since first detection", standoff: 10 },
            color: "#e8e8ea", gridcolor: "transparent",
        },
        yaxis: { title: "Magnitude", autorange: "reversed", color: "#e8e8ea", gridcolor: "#33353e" },
        paper_bgcolor: "#1b1d23", plot_bgcolor: "#1b1d23", font: { color: "#e8e8ea" },
        legend: { font: { size: 10 } },
        margin: { t: 140 },
    };
    Plotly.react(lcDiv, traces, layout, { responsive: true });
    attachClickListener();
    attachRelayoutListener();
}

// Plotly.react (unlike newPlot) updates the existing plot in place and
// preserves listeners registered via `.on()`, so attaching once here is
// enough for every subsequent object; guarded anyway in case a future edit
// reintroduces a newPlot() call somewhere.
let clickListenerAttached = false;
function attachClickListener() {
    if (clickListenerAttached) return;
    clickListenerAttached = true;
    lcDiv.on("plotly_click", async (evt) => {
        const point = evt.points[0];
        const epochIdx = point.customdata;
        if (currentObjid === null || epochIdx === null || epochIdx === undefined) {
            cutoutHint.textContent = "No cutout available for this point (not a DECam epoch).";
            cutoutHint.style.display = "block";
            cutoutsDiv.style.display = "none";
            return;
        }
        await loadCutouts(currentObjid, epochIdx);
    });
}

async function loadCutouts(objid, epochIdx) {
    const res = await fetch(`/api/objects/${encodeURIComponent(objid)}/cutout/${epochIdx}`);
    if (!res.ok) return;
    const data = await res.json();
    document.getElementById("cutout-template").src = `data:image/png;base64,${data.template}`;
    document.getElementById("cutout-science").src = `data:image/png;base64,${data.science}`;
    document.getElementById("cutout-diff").src = `data:image/png;base64,${data.diff}`;
    cutoutHint.style.display = "none";
    cutoutsDiv.style.display = "flex";
}

document.getElementById("prevBtn").onclick = () => {
    if (!objids.length) return;
    index = (index - 1 + objids.length) % objids.length;
    drawCurrent();
};
document.getElementById("nextBtn").onclick = () => {
    if (!objids.length) return;
    index = (index + 1) % objids.length;
    drawCurrent();
};
document.getElementById("favBtn").onclick = async () => {
    if (!objids.length) return;
    const objid = objids[index];
    await fetch(`/api/favorites/${encodeURIComponent(objid)}`, { method: "POST" });
    favorites.add(objid);
    updateFavButton(objid);
};
document.getElementById("applyFilter").onclick = async () => {
    const val = document.getElementById("objidsFile").value.trim();
    if (!val) {
        await loadObjects(null);
        return;
    }
    // A bare objid (no path separator, doesn't look like a filename) jumps
    // straight to that object instead of being treated as an objids file.
    if (!val.includes("/") && !val.includes(".") && !val.endsWith(".txt")) {
        const res = await fetch(`/api/objects/${encodeURIComponent(val)}/lightcurve`);
        if (res.ok) {
            objids = [val];
            index = 0;
            await drawCurrent();
            return;
        }
    }
    await loadObjects(val);
};

(async function init() {
    await loadFavorites();
    await loadObjects(null);
})();
</script>
</body>
</html>
