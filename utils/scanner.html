<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tidez scanner</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #0b0d12;
        --surface: #12141b;
        --surface-2: #191c25;
        --border: #262a36;
        --text: #e8eaf0;
        --text-dim: #868da0;
        --text-faint: #4c515f;
        --accent: #4fb8e8;
        --accent-dim: rgba(79, 184, 232, 0.14);
        --gold: #e0ac3f;
        --gold-dim: rgba(224, 172, 63, 0.16);
        --red: #ff6b6b;
        --red-dim: rgba(255, 107, 107, 0.14);
        --green: #3ddc71;
        --green-dim: rgba(61, 220, 113, 0.12);
        --radius: 10px;
        --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: var(--font-ui);
        background: var(--bg);
        color: var(--text);
    }

    header {
        padding: 12px 24px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
    }
    .wordmark {
        font-family: var(--font-display);
        font-size: 1.05em;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--text);
        display: flex;
        align-items: baseline;
        gap: 7px;
        margin-right: 4px;
    }
    .wordmark .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); }

    .filter-box { display: flex; align-items: center; gap: 8px; }
    input {
        background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
        border-radius: 7px; padding: 7px 11px; font-size: 0.85em; width: 250px;
        font-family: var(--font-mono);
    }
    input:focus, button:focus-visible {
        outline: none; border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-dim);
    }
    button {
        background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
        border-radius: 7px; padding: 7px 13px; font-size: 0.85em; cursor: pointer;
        transition: background 0.12s, border-color 0.12s;
    }
    button:hover { background: #21242f; border-color: #333748; }
    button.fav.active { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); font-weight: 600; }
    button.report.active { background: var(--red-dim); border-color: var(--red); color: var(--red); font-weight: 600; }
    .nav-group { display: flex; gap: 6px; }
    #status {
        color: var(--text-dim); font-size: 0.85em; font-family: var(--font-mono);
        margin-left: auto; white-space: nowrap;
    }

    #idBar {
        padding: 9px 24px; background: var(--bg); border-bottom: 1px solid var(--border);
        display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    }
    .chip {
        display: flex; align-items: center; gap: 7px;
        background: var(--surface); border: 1px solid var(--border); border-radius: 7px;
        padding: 5px 10px 5px 6px; cursor: pointer; font-size: 0.82em;
        transition: border-color 0.12s, background 0.12s;
    }
    .chip:hover { border-color: #363b4a; background: var(--surface-2); }
    .chip:active { transform: translateY(1px); }
    .chip .swatch { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .chip .chip-label { color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.82em; }
    .chip .chip-value { font-family: var(--font-mono); color: var(--text); }
    .chip .chip-value.empty { color: var(--text-faint); }
    .chip.copied { border-color: var(--accent); background: var(--accent-dim); }
    .chip.copied .chip-value { color: var(--accent); }

    .tns-group { display: flex; align-items: center; gap: 6px; }
    a.tns-btn {
        font-size: 0.82em; padding: 5px 11px; border-radius: 7px; text-decoration: none;
        background: var(--surface); border: 1px solid var(--border); color: var(--text);
        font-family: var(--font-mono); transition: border-color 0.12s, background 0.12s;
    }
    a.tns-btn:hover { border-color: var(--accent); background: var(--accent-dim); }
    a.tns-btn.disabled { color: var(--text-faint); pointer-events: none; }
    .tns-badge {
        font-size: 0.75em; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--border);
        color: var(--text-dim); white-space: nowrap;
    }
    .tns-badge.on { color: var(--green); border-color: var(--green); background: var(--green-dim); }
    .tns-badge.off { color: var(--red); border-color: var(--red); background: var(--red-dim); }

    main { padding: 22px 24px 32px; max-width: 1180px; margin: 0 auto; }

    #plot-card {
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 6px 10px 2px;
    }
    #lightcurve { width: 100%; height: 380px; }

    .section-label {
        font-family: var(--font-display); font-size: 0.78em; font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint);
        margin: 26px 2px 10px;
    }

    #imagingGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .img-card {
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 10px; text-align: center;
    }
    .img-card .label {
        font-size: 0.72em; text-transform: uppercase; letter-spacing: 0.06em;
        color: var(--text-faint); margin-bottom: 8px; font-weight: 600;
    }
    .img-card .frame {
        aspect-ratio: 1; border-radius: 6px; background: #000;
        display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .img-card .frame img { width: 100%; height: 100%; object-fit: contain; }
    .img-card .frame .placeholder { color: var(--text-faint); font-size: 0.75em; padding: 0 12px; }
    .img-card .meta { font-size: 0.7em; color: var(--text-faint); margin-top: 7px; font-family: var(--font-mono); }
    .img-card .viewer-link { display: block; margin-top: 9px; font-size: 0.72em; color: var(--accent); text-decoration: none; }
    .img-card .viewer-link:hover { text-decoration: underline; }

    @media (max-width: 860px) {
        #imagingGrid { grid-template-columns: repeat(2, 1fr); }
    }
</style>
</head>
<body>

<header>
    <div class="wordmark"><span class="dot"></span>tidez scanner</div>
    <div class="filter-box">
        <input id="objidsFile" type="text" placeholder="objids file or objid — blank = all">
        <button id="applyFilter">Apply</button>
    </div>
    <div class="nav-group">
        <button id="prevBtn">‹ Prev</button>
        <button id="nextBtn">Next ›</button>
    </div>
    <button id="favBtn" class="fav">☆ Favorite</button>
    <button id="reportBtn" class="report" title="DECam data needs reporting to TNS (data/tns_to_report.txt)">⚑ To report</button>
    <span id="status"></span>
</header>

<div id="idBar">
    <div class="chip" data-target="decamId"><span class="swatch" style="background:#4fb8e8"></span><span class="chip-label">DECam</span><span class="chip-value" id="decamId">—</span></div>
    <div class="chip" data-target="programId"><span class="swatch" style="background:#868da0"></span><span class="chip-label">Program</span><span class="chip-value" id="programId">—</span></div>
    <div class="tns-group">
        <a id="tnsBtn" class="tns-btn disabled" href="#" target="_blank" rel="noopener">TNS ↗</a>
        <span id="tnsBadge" class="tns-badge">—</span>
    </div>
    <div class="chip" data-target="ztfId"><span class="swatch" style="background:#b06bff"></span><span class="chip-label">ZTF</span><span class="chip-value" id="ztfId">—</span></div>
    <div class="chip" data-target="rubinId"><span class="swatch" style="background:#3ddc71"></span><span class="chip-label">Rubin</span><span class="chip-value" id="rubinId">—</span></div>
    <div class="chip" data-target="radecId"><span class="swatch" style="background:#e0ac3f"></span><span class="chip-label">RA, Dec</span><span class="chip-value" id="radecId">—</span></div>
</div>

<main>
    <div id="plot-card">
        <div id="lightcurve"></div>
    </div>

    <div class="section-label">Imaging</div>
    <div id="imagingGrid">
        <div class="img-card">
            <div class="label">Legacy Survey</div>
            <div class="frame" id="legacy-frame"><span class="placeholder">Loading…</span></div>
            <div class="meta" id="legacy-meta"></div>
            <a id="legacyViewerLink" class="viewer-link" href="#" target="_blank" rel="noopener">Open in Legacy Survey ↗</a>
        </div>
        <div class="img-card">
            <div class="label">Template</div>
            <div class="frame" id="template-frame"><span class="placeholder">Click a DECam point</span></div>
        </div>
        <div class="img-card">
            <div class="label">Science</div>
            <div class="frame" id="science-frame"><span class="placeholder">Click a DECam point</span></div>
        </div>
        <div class="img-card">
            <div class="label">Diff</div>
            <div class="frame" id="diff-frame"><span class="placeholder">Click a DECam point</span></div>
        </div>
    </div>
</main>

<script>
// Wavelength-ordered filter colours (violet -> blue -> orange -> reds), shared with
// plot_lightcurve.py / plot_decam_ztf.py. z and y are very dark, so markers get a
// light outline (MARKER_OUTLINE) to stay visible on the dark background.
const BAND_COLORS = {
    u: "#7A1FD6",  // ~367 nm, violet (UV edge)
    g: "#00B4FF",  // ~482 nm, blue
    r: "#FF6A00",  // ~622 nm, orange-red
    i: "#D4001A",  // ~755 nm, deep red (near IR)
    z: "#8B0000",  // ~869 nm, dark red (IR)
    y: "#4A0A0A",  // ~971 nm, very dark maroon (IR)
};
const MARKER_OUTLINE = "rgba(232, 234, 240, 0.75)";
const SURVEY_SYMBOL = { DECam: "diamond", ZTF: "circle", LSST: "triangle-up" };

let objids = [];
let index = 0;
// list name (as in /api/lists/{name}) -> Set of objids
const lists = { favorites: new Set(), report: new Set() };
let currentObjid = null;

// Bumped on every drawCurrent() call; a fetch response is only applied if
// this still matches the token it was issued under, so out-of-order
// responses from rapid Prev/Next clicks can't clobber a newer render.
let renderToken = 0;

const statusEl = document.getElementById("status");
const favBtn = document.getElementById("favBtn");
const reportBtn = document.getElementById("reportBtn");
const lcDiv = document.getElementById("lightcurve");

function setChip(id, value) {
    const el = document.getElementById(id);
    el.textContent = value || "—";
    el.classList.toggle("empty", !value);
}

function updateIdBar(data) {
    setChip("decamId", data.objid);
    setChip("programId", data.program);
    setChip("ztfId", data.ztf_id);
    setChip("rubinId", data.lsst_id);
    setChip("radecId", `${data.ra}, ${data.dec}`);
    updateTns(data);

    const viewerUrl = `https://www.legacysurvey.org/viewer?ra=${data.ra}&dec=${data.dec}&layer=ls-dr10&zoom=16&mark=${data.ra},${data.dec}`;
    document.getElementById("legacyViewerLink").href = viewerUrl;
}

document.getElementById("idBar").addEventListener("click", async (evt) => {
    const chip = evt.target.closest(".chip");
    if (!chip) return;
    const valueEl = document.getElementById(chip.dataset.target);
    const value = valueEl.textContent;
    if (!value || value === "—") return;
    await navigator.clipboard.writeText(value);
    chip.classList.add("copied");
    setTimeout(() => chip.classList.remove("copied"), 900);
});

function niceStep(range, targetTicks = 6) {
    const rough = range / targetTicks || 1;
    const mag = Math.pow(10, Math.floor(Math.log10(rough)));
    const norm = rough / mag;
    const step = norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10;
    return step * mag;
}

// Decimal places to show for a given tick step, so zooming into an hour-
// scale window doesn't collapse every tick to the same rounded integer day.
function decimalsForStep(step) {
    if (step >= 1) return 0;
    if (step >= 0.1) return 1;
    if (step >= 0.01) return 2;
    return 3;
}

// Recompute tick positions/labels for whatever x-range is currently
// visible (full extent on first draw, or the zoomed-in sub-range after a
// plotly_relayout). totalSpan converts "days since first detection" (the
// underlying x data) to "days ago" for the bottom axis's labels.
function computeTicks(rangeMin, rangeMax, totalSpan) {
    const step = niceStep(rangeMax - rangeMin);
    const decimals = decimalsForStep(step);
    const start = Math.ceil(rangeMin / step) * step;
    const tickvals = [];
    for (let v = start; v <= rangeMax + step / 2; v += step) tickvals.push(v);
    const ticktextDaysAgo = tickvals.map(v => (totalSpan - v).toFixed(decimals));
    const ticktextSinceFirst = tickvals.map(v => v.toFixed(decimals));
    return { tickvals, ticktextDaysAgo, ticktextSinceFirst };
}

// State for the current plot's full range / span, read by the
// plotly_relayout handler below to rebuild ticks on zoom/pan/reset.
let plotTotalSpan = 0;
let plotFullRange = [0, 1];

let relayoutListenerAttached = false;
function attachRelayoutListener() {
    if (relayoutListenerAttached) return;
    relayoutListenerAttached = true;
    lcDiv.on("plotly_relayout", (evt) => {
        let rMin, rMax;
        if (evt["xaxis.range[0]"] !== undefined && evt["xaxis.range[1]"] !== undefined) {
            rMin = evt["xaxis.range[0]"];
            rMax = evt["xaxis.range[1]"];
        } else if (evt["xaxis.autorange"] || evt["xaxis.range"] !== undefined) {
            // Double-click reset (or programmatic full-range reset).
            [rMin, rMax] = plotFullRange;
        } else {
            return;  // some other relayout (e.g. our own tick update below); ignore
        }
        const { tickvals, ticktextDaysAgo, ticktextSinceFirst } = computeTicks(rMin, rMax, plotTotalSpan);
        Plotly.relayout(lcDiv, {
            "xaxis.tickvals": tickvals, "xaxis.ticktext": ticktextDaysAgo,
            "xaxis2.tickvals": tickvals, "xaxis2.ticktext": ticktextSinceFirst,
        });
    });
}

function updateTns(data) {
    const btn = document.getElementById("tnsBtn");
    const badge = document.getElementById("tnsBadge");
    if (data.tns_name) {
        btn.href = data.tns_url;
        btn.textContent = `${data.tns_name}${data.tns_type ? " · " + data.tns_type : ""} ↗`;
        btn.classList.remove("disabled");
        badge.textContent = data.decam_on_tns ? "DECam on TNS" : "DECam not on TNS";
        badge.className = "tns-badge " + (data.decam_on_tns ? "on" : "off");
    } else {
        btn.href = "#";
        btn.textContent = "TNS ↗";
        btn.classList.add("disabled");
        badge.textContent = "Not on TNS";
        badge.className = "tns-badge off";
    }
}

async function loadLists() {
    for (const name of Object.keys(lists)) {
        const res = await fetch(`/api/lists/${name}`);
        lists[name] = new Set((await res.json()).objids);
    }
}

async function toggleList(name) {
    if (!objids.length) return;
    const objid = objids[index];
    const inList = lists[name].has(objid);
    const res = await fetch(`/api/lists/${name}/${encodeURIComponent(objid)}`,
                            { method: inList ? "DELETE" : "POST" });
    if (!res.ok) return;
    inList ? lists[name].delete(objid) : lists[name].add(objid);
    updateListButtons(objid);
}

async function loadObjects(objidsFile) {
    const url = objidsFile ? `/api/objects?objids_file=${encodeURIComponent(objidsFile)}` : "/api/objects";
    const res = await fetch(url);
    if (!res.ok) {
        statusEl.textContent = `Error: ${(await res.json()).detail}`;
        return;
    }
    const data = await res.json();
    objids = data.objids;
    index = 0;
    if (objids.length === 0) {
        statusEl.textContent = "No objects found.";
        Plotly.purge(lcDiv);
        return;
    }
    await drawCurrent();
}

function updateListButtons(objid) {
    const isFav = lists.favorites.has(objid);
    favBtn.textContent = isFav ? "★ Favorited" : "☆ Favorite";
    favBtn.classList.toggle("active", isFav);
    const toReport = lists.report.has(objid);
    reportBtn.textContent = toReport ? "⚑ To report ✓" : "⚑ To report";
    reportBtn.classList.toggle("active", toReport);
}

function resetCutouts() {
    for (const key of ["template", "science", "diff"]) {
        document.getElementById(`${key}-frame`).innerHTML = '<span class="placeholder">Click a DECam point</span>';
    }
}

const legacyFrame = document.getElementById("legacy-frame");
const legacyMeta = document.getElementById("legacy-meta");

async function loadLegacyCutout(objid) {
    legacyFrame.innerHTML = '<span class="placeholder">Loading…</span>';
    legacyMeta.textContent = "";
    const res = await fetch(`/api/objects/${encodeURIComponent(objid)}/legacy-cutout`);
    if (currentObjid !== objid) return;  // object changed while this was in flight
    if (!res.ok) {
        legacyFrame.innerHTML = '<span class="placeholder">No cutout stored</span>';
        return;
    }
    const data = await res.json();
    legacyFrame.innerHTML = "";
    const img = document.createElement("img");
    img.src = `data:image/png;base64,${data.image}`;
    legacyFrame.appendChild(img);
    legacyMeta.textContent = `${data.layer}, ${data.pixscale}"/px`;
}

function buildTraces(rows) {
    const detectedJds = rows.filter(r => r.detected).map(r => r.jd);
    const jdFirst = detectedJds.length ? Math.min(...detectedJds) : Math.min(...rows.map(r => r.jd));

    const byLabel = {};
    for (const r of rows) {
        const label = r.detected ? `${r.band} (${r.survey})` : `${r.band} upper limit (${r.survey})`;
        if (!byLabel[label]) byLabel[label] = { rows: [], detected: r.detected, band: r.band, survey: r.survey };
        byLabel[label].rows.push(r);
    }

    const traces = [];
    for (const [label, group] of Object.entries(byLabel)) {
        const color = BAND_COLORS[group.band] || "#888888";
        const symbol = SURVEY_SYMBOL[group.survey] || "x";
        const isDecam = group.survey === "DECam";
        const xs = group.rows.map(r => r.jd - jdFirst);
        const ys = group.rows.map(r => group.detected ? r.mag : r.limmag);
        const customdata = group.rows.map(r => r.epoch_idx);
        // SNR/STATUS_FPHOT ('p'/'q'/'m') come from DECam forced photometry on
        // the difference image; surface them in the hover so it's easy to
        // eyeball which points are reliable ('p' > 'q' > 'm').
        const text = group.rows.map(r => isDecam
            ? `SNR: ${r.snr != null ? r.snr.toFixed(1) : "n/a"}  |  status: ${r.status}`
            : "");

        if (group.detected) {
            traces.push({
                x: xs, y: ys, customdata, text,
                error_y: { type: "data", array: group.rows.map(r => r.magerr), visible: true, color },
                mode: "markers", type: "scatter", name: label,
                marker: { color, symbol, size: 9, line: { width: 1, color: MARKER_OUTLINE } },
                hovertemplate: `${label}<br>mag: %{y:.3f}<br>%{text}<extra></extra>`,
            });
        } else {
            traces.push({
                x: xs, y: ys, customdata, text,
                mode: "markers", type: "scatter", name: label,
                marker: { color, symbol: "triangle-down", size: 8, opacity: 0.55,
                          line: { width: 1, color: MARKER_OUTLINE } },
                hovertemplate: `${label}<br>lim. mag (5σ): %{y:.3f}<br>%{text}<extra></extra>`,
            });
        }
    }
    return traces;
}

async function drawCurrent() {
    const token = ++renderToken;

    resetCutouts();
    const objid = objids[index];
    updateListButtons(objid);
    statusEl.textContent = `[${index + 1}/${objids.length}]  ${objid}`;

    const res = await fetch(`/api/objects/${encodeURIComponent(objid)}/lightcurve`);
    const data = await res.json();

    if (token !== renderToken) return;  // a newer Prev/Next click already superseded this one
    currentObjid = objid;
    updateIdBar(data);
    loadLegacyCutout(objid);

    if (!data.rows.length) {
        Plotly.react(lcDiv, [], {
            paper_bgcolor: "#12141b", plot_bgcolor: "#12141b", font: { color: "#e8eaf0" },
            annotations: [{ text: "No lightcurve data", showarrow: false, font: { size: 14, color: "#868da0" },
                             xref: "paper", yref: "paper", x: 0.5, y: 0.5 }],
        });
        attachClickListener();
        return;
    }

    const traces = buildTraces(data.rows);

    const xs = traces.flatMap(t => t.x);
    const xMin = Math.min(0, ...xs);
    const xMax = Math.max(...xs);
    const totalSpan = data.jd_now - data.jd_first;
    const pad = (xMax - xMin) * 0.04 || 1;
    const range = [xMin - pad, xMax + pad];

    plotTotalSpan = totalSpan;
    plotFullRange = range;
    const { tickvals, ticktextDaysAgo, ticktextSinceFirst } = computeTicks(range[0], range[1], totalSpan);

    // xaxis2 mirrors xaxis' range (via `matches`) to draw a second, top-side
    // tick row over the same physical positions with different labels.
    traces.push({
        x: [xMin, xMax], y: [null, null], xaxis: "x2", yaxis: "y",
        mode: "markers", marker: { opacity: 0 }, showlegend: false, hoverinfo: "skip",
    });

    const layout = {
        xaxis: {
            title: { text: "Days ago", font: { size: 11 } }, range, tickvals, ticktext: ticktextDaysAgo,
            color: "#868da0", gridcolor: "#1e212b", tickfont: { size: 10 },
        },
        xaxis2: {
            overlaying: "x", matches: "x", side: "top",
            tickvals, ticktext: ticktextSinceFirst,
            title: { text: "Days since first detection", font: { size: 11 }, standoff: 8 },
            color: "#868da0", gridcolor: "transparent", tickfont: { size: 10 },
        },
        yaxis: {
            title: { text: "Magnitude", font: { size: 11 } }, autorange: "reversed",
            color: "#868da0", gridcolor: "#1e212b", tickfont: { size: 10 },
        },
        paper_bgcolor: "#12141b", plot_bgcolor: "#12141b", font: { color: "#e8eaf0", family: "-apple-system, sans-serif" },
        legend: { font: { size: 9.5, color: "#868da0" }, bgcolor: "rgba(0,0,0,0)", itemwidth: 30 },
        margin: { t: 44, r: 150, l: 56, b: 46 },
    };
    Plotly.react(lcDiv, traces, layout, { responsive: true, displaylogo: false });
    attachClickListener();
    attachRelayoutListener();
}

// Plotly.react (unlike newPlot) updates the existing plot in place and
// preserves listeners registered via `.on()`, so attaching once here is
// enough for every subsequent object; guarded anyway in case a future edit
// reintroduces a newPlot() call somewhere.
let clickListenerAttached = false;
function attachClickListener() {
    if (clickListenerAttached) return;
    clickListenerAttached = true;
    lcDiv.on("plotly_click", async (evt) => {
        const point = evt.points[0];
        const epochIdx = point.customdata;
        if (currentObjid === null || epochIdx === null || epochIdx === undefined) {
            for (const key of ["template", "science", "diff"]) {
                document.getElementById(`${key}-frame`).innerHTML = '<span class="placeholder">Not a DECam epoch</span>';
            }
            return;
        }
        await loadCutouts(currentObjid, epochIdx);
    });
}

async function loadCutouts(objid, epochIdx) {
    const res = await fetch(`/api/objects/${encodeURIComponent(objid)}/cutout/${epochIdx}`);
    if (!res.ok) {
        // scan bundles keep cutouts for detections only; don't leave the previous epoch's images up
        for (const key of ["template", "science", "diff"]) {
            document.getElementById(`${key}-frame`).innerHTML =
                '<span class="placeholder">No cutout stored for this epoch</span>';
        }
        return;
    }
    const data = await res.json();
    for (const [key, b64] of [["template", data.template], ["science", data.science], ["diff", data.diff]]) {
        const frame = document.getElementById(`${key}-frame`);
        frame.innerHTML = "";
        const img = document.createElement("img");
        img.src = `data:image/png;base64,${b64}`;
        frame.appendChild(img);
    }
}

document.getElementById("prevBtn").onclick = () => {
    if (!objids.length) return;
    index = (index - 1 + objids.length) % objids.length;
    drawCurrent();
};
document.getElementById("nextBtn").onclick = () => {
    if (!objids.length) return;
    index = (index + 1) % objids.length;
    drawCurrent();
};
favBtn.onclick = () => toggleList("favorites");
reportBtn.onclick = () => toggleList("report");
document.getElementById("applyFilter").onclick = async () => {
    const val = document.getElementById("objidsFile").value.trim();
    if (!val) {
        await loadObjects(null);
        return;
    }
    // A bare objid (no path separator, doesn't look like a filename) jumps
    // straight to that object instead of being treated as an objids file.
    if (!val.includes("/") && !val.includes(".") && !val.endsWith(".txt")) {
        const res = await fetch(`/api/objects/${encodeURIComponent(val)}/lightcurve`);
        if (res.ok) {
            objids = [val];
            index = 0;
            await drawCurrent();
            return;
        }
    }
    await loadObjects(val);
};

(async function init() {
    await loadLists();
    await loadObjects(null);
})();
</script>
