[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tidez"
version = "0.1.0"
dependencies = [
    "astropy",
    "numpy",
    "h5py",
    "tqdm",
    "requests",
    "matplotlib",
    "pillow",
    "fastapi",
    "uvicorn",
]

[tool.hatch.build.targets.wheel]
packages = ["tidez"]